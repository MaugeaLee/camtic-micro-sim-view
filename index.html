<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro-Cell Viewer</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="viewport"></div>

<header class="topbar">
  <div class="brand-row">
    <div class="brand">Micro-Cell Viewer</div>
    <button type="button" id="btnAdmin">Admin</button>
  </div>
  <div class="controls">
    <button id="btnPlay">재생</button>
    <div id="speedSeg" class="seg"></div>
    <span id="clock">00:00:00</span>
  </div>
</header>

<aside class="panel left">
  <h2>셀</h2>
  <ul id="cellList" class="cells"></ul>
  <div id="buildBar" class="buildbar" hidden>
    <h2>짓기</h2>
    <p class="hint">좌클릭 집기·놓기 · 우클릭 회전 · R 90°</p>
    <div id="placeSeg" class="seg"></div>
    <div class="build-actions">
      <button type="button" id="btnLayoutDl">내려받기</button>
      <button type="button" id="btnLayoutUp">올리기</button>
    </div>
    <input id="layoutFile" type="file" accept="application/json,.json" hidden>
  </div>
</aside>

<aside class="panel right">
  <h2>로그</h2>
  <ul id="logList" class="log"></ul>
</aside>

<footer class="bottombar"><span id="statusLine">부팅 중…</span></footer>

<script>
/*__ENV__*/
if (/\.github\.io$/.test(location.hostname)) window.MICROSIM_NO_SERVER = true;
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
