<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro-Cell Viewer</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="viewport"></div>

<header class="topbar">
  <div class="brand-row">
    <div class="brand">Micro-Cell Viewer</div>
    <button type="button" id="btnAdmin">Admin</button>
  </div>
  <div class="controls">
    <select id="scenarioSel" title="시나리오 (가정값)"></select>
    <button id="btnPlay">재생</button>
    <div id="speedSeg" class="seg"></div>
    <span id="clock">00:00:00</span>
  </div>
</header>

<aside class="panel left" id="panelLeft">
  <div class="panel-head">
    <h2>셀</h2>
    <button type="button" class="panel-toggle" aria-expanded="true" aria-controls="panelLeftBody" title="셀 패널 접기"></button>
  </div>
  <div class="panel-body" id="panelLeftBody">
    <ul id="cellList" class="cells"></ul>
    <div id="fleetBox" class="fleetbox" hidden>
      <h2>공급 AMR <small id="fleetSum"></small></h2>
      <p id="acsLine" class="acsline"></p>
      <ul id="amrList" class="amrs"></ul>
      <p class="hint">셀·AMR 클릭 = 카메라 포커스 · Esc 해제. 사이클 시간은 가정값</p>
    </div>
    <div id="buildBar" class="buildbar" hidden>
      <h2>짓기</h2>
      <div id="buildMode" class="seg">
        <button type="button" data-mode="cells">셀 배치</button>
        <button type="button" data-mode="route">AMR 경로</button>
        <button type="button" data-mode="parts" title="부품 운송 AMR 루트·도킹 자리(창고·SORT 투입·라인 도크)">부품 AMR 도크</button>
      </div>
      <p id="buildHint" class="hint"></p>
      <div id="placeSeg" class="seg"></div>
      <div class="build-actions">
        <button type="button" id="btnLayoutSave" title="셀 자리와 AMR 경로를 서버 layout 파일로 저장">저장</button>
        <button type="button" id="btnLayoutDl">내려받기</button>
        <button type="button" id="btnLayoutUp">올리기</button>
      </div>
      <input id="layoutFile" type="file" accept="application/json,.json" hidden>
    </div>
  </div>
</aside>

<aside class="panel right" id="panelRight">
  <div class="panel-head">
    <button type="button" class="panel-toggle" aria-expanded="true" aria-controls="panelRightBody" title="로그 패널 접기"></button>
    <h2>로그</h2>
  </div>
  <div class="panel-body" id="panelRightBody">
    <ul id="logList" class="log"></ul>
  </div>
</aside>

<footer class="bottombar"><span id="statusLine">부팅 중…</span></footer>

<script>
/*__ENV__*/
if (/\.github\.io$/.test(location.hostname)) window.MICROSIM_NO_SERVER = true;
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
