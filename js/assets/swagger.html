<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swagger UI</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body { overflow: auto; height: auto; min-height: 100%; }
  #viewport { display: none; }
  .sw { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  .sw-top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .sw-top h1 { margin: 0; font-size: 22px; font-weight: 650; }
  .sw-top a { color: var(--accent); text-decoration: none; }
  .sw-meta { color: var(--muted); margin: 0 0 18px; }
  .sw-meta code { color: var(--text); }
  .sw-info { margin: 0 0 20px; color: var(--text); }
  .op { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 10px; background: var(--panel); overflow: hidden; }
  .op > summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; list-style: none; }
  .op > summary::-webkit-details-marker { display: none; }
  .op > summary:hover { background: rgba(79, 179, 255, 0.08); }
  .op .verb { font: 700 11px/1 ui-monospace, Consolas, monospace; padding: 4px 8px; border-radius: 4px; min-width: 48px; text-align: center; }
  .op .verb-get { background: rgba(60, 207, 142, 0.22); color: var(--ok); }
  .op .path { font: 13px/1.3 ui-monospace, Consolas, monospace; }
  .op .sum { color: var(--muted); margin-left: auto; }
  .op-body { padding: 0 12px 12px; border-top: 1px solid var(--line); }
  .params { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 12px; }
  .params th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 8px 4px 0; }
  .params td { padding: 4px 8px 4px 0; vertical-align: middle; }
  .params input, .params select { font: inherit; color: inherit; background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; width: 100%; max-width: 280px; }
  .req { color: var(--warn); font-size: 11px; }
  pre.out { margin: 8px 0 0; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.35); overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  .out-h { color: var(--muted); margin-top: 12px; }
  .tag { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 8px; }
</style>
</head>
<body>
<script>/*__ENV__*/</script>
<div class="sw">
  <div class="sw-top">
    <h1>Swagger UI</h1>
    <a href="/">뷰어</a>
  </div>
  <p class="sw-meta" id="meta">스펙 로드 중…</p>
  <p class="sw-info" id="info"></p>
  <div id="ops"></div>
</div>
<script type="module" src="/js/assets/swagger.js"></script>
</body>
</html>
